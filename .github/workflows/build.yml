name: Build Binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Windows needs MSYS2 so we can use gcc and UCRT64.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      # manylinux_2_28 sets the glibc baseline to 2.28 (RHEL 8+, Ubuntu 20.04+).
      - name: Compile (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pytinyfiledialogs
          docker run --rm \
            -v "$PWD:/src" -w /src \
            --user "$(id -u):$(id -g)" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            gcc -shared -fPIC -O2 -static-libgcc src/tinyfiledialogs.c \
              -o pytinyfiledialogs/libtinyfiledialogs.so

      # Universal2 covers both Intel and Apple Silicon. The deployment target
      # keeps the dylib usable on macOS 11 and newer.
      - name: Compile (macOS, universal2)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pytinyfiledialogs
          clang -dynamiclib -O2 \
            -mmacosx-version-min=11.0 \
            -arch arm64 -arch x86_64 \
            src/tinyfiledialogs.c \
            -o pytinyfiledialogs/libtinyfiledialogs.dylib

      # comdlg32 and ole32 are not part of MinGW's default link line.
      # -static-libgcc avoids a hidden dependency on libgcc_s_*.dll.
      - name: Compile (Windows, UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p pytinyfiledialogs
          gcc -shared -O2 -static-libgcc src/tinyfiledialogs.c \
            -o pytinyfiledialogs/libtinyfiledialogs.dll \
            -Wl,--export-all-symbols \
            -lcomdlg32 -lole32 -luser32 -lshell32 -lgdi32

      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -c "import ctypes; lib = ctypes.CDLL('pytinyfiledialogs/libtinyfiledialogs.so'); print(lib.tinyfd_messageBox)"
          objdump -T pytinyfiledialogs/libtinyfiledialogs.so \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1

      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -c "import ctypes; lib = ctypes.CDLL('pytinyfiledialogs/libtinyfiledialogs.dylib'); print(lib.tinyfd_messageBox)"
          lipo -info pytinyfiledialogs/libtinyfiledialogs.dylib

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import ctypes; lib = ctypes.CDLL('pytinyfiledialogs/libtinyfiledialogs.dll'); print(lib.tinyfd_messageBox)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfd-binary-${{ runner.os }}
          path: pytinyfiledialogs/libtinyfiledialogs.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag: $TAG"
          echo "version: $VERSION"
          test "$TAG" = "$VERSION"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Put binaries in the package
        run: |
          mkdir -p pytinyfiledialogs
          find artifacts -name 'libtinyfiledialogs.*' -exec cp {} pytinyfiledialogs/ \;
          ls -l pytinyfiledialogs/

      - name: Require all three binaries
        run: |
          test -f pytinyfiledialogs/libtinyfiledialogs.so
          test -f pytinyfiledialogs/libtinyfiledialogs.dylib
          test -f pytinyfiledialogs/libtinyfiledialogs.dll

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --generate-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Put binaries in the package
        run: |
          mkdir -p pytinyfiledialogs
          find artifacts -name 'libtinyfiledialogs.*' -exec cp {} pytinyfiledialogs/ \;
          ls -l pytinyfiledialogs/

      - name: Require all three binaries
        run: |
          test -f pytinyfiledialogs/libtinyfiledialogs.so
          test -f pytinyfiledialogs/libtinyfiledialogs.dylib
          test -f pytinyfiledialogs/libtinyfiledialogs.dll

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/